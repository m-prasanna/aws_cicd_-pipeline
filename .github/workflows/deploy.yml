name: Push to EC2

# Main branch එකට code එකක් push කරපු ගමන් මේක වැඩ කරන්න ඕනේ
on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub එකෙන් code එක ගන්නවා
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. EC2 එකට සම්බන්ධ වෙලා Docker image එක build කරලා run කරනවා
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ "3.90.241.251" }}
          username: ubuntu
          key: ${{ "igxEp9e0i5qtyBoUd02urhiG9RYrR4Ix5v8GYQGQ" }}
          script: |
            # පරණට run වෙන container එක නවත්තලා අයින් කරනවා
            sudo docker stop my-web-app || true
            sudo docker rm my-web-app || true
            
            # දැනට තියෙන තැනට ගිහින් අලුත් code එක අරන් build කරනවා
            # (සරලවම කිව්වොත්: තියෙන තැනම Docker image එක හදනවා)
            sudo docker build -t my-web-app .
            
            # අලුත් container එක Port 80 එකේ run කරනවා
            sudo docker run -d --name my-web-app -p 80:80 my-web-app