name: Push to EC2

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          # METHANA THAMAI FIX EKAI THIYENNE:
          host: "3.90.241.251"
          username: ubuntu
          key: "igxEp9e0i5qtyBoUd02urhiG9RYrR4Ix5v8GYQGQ"
          script: |
            sudo docker stop my-web-app || true
            sudo docker rm my-web-app || true
            
            # NOTE: Oyage server eke code eka thiyena path ekata mehema 'cd' karanna wenawa build eka danna kalin
            # Udaharanayak: cd /home/ubuntu/my-project-folder 
            
            sudo docker build -t my-web-app .
            sudo docker run -d --name my-web-app -p 80:80 my-web-app