<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sri Lanka Travel</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}

    body{background:#f8fafc;color:#1e293b;scroll-behavior:smooth}

    /* Navbar */
    nav{
      position:fixed;
      width:100%;
      top:0;
      display:flex;
      justify-content:space-between;
      padding:15px 60px;
      background:rgba(0,0,0,0.6);
      backdrop-filter: blur(10px);
      color:#fff;
      z-index:1000;
    }

    nav a{color:#fff;text-decoration:none;margin-left:20px;font-weight:500}

    /* Hero */
    header{
      height:100vh;
      background:url('https://images.unsplash.com/photo-1544739313-6fadf73f4c3b') center/cover no-repeat;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      color:#fff;
      position:relative;
    }

    header::after{
      content:'';
      position:absolute;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.4);
    }

    header .content{
      position:relative;
      z-index:2;
      animation:fadeUp 1.5s ease;
    }

    header h1{font-size:64px;font-weight:700}
    header p{margin-top:15px;font-size:20px}

    /* Sections */
    section{padding:100px 60px}

    h2{text-align:center;font-size:32px;margin-bottom:40px}

    /* Cards */
    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
      gap:25px;
    }

    .card{
      border-radius:20px;
      overflow:hidden;
      background:#fff;
      box-shadow:0 10px 25px rgba(0,0,0,0.1);
      transform:translateY(40px);
      opacity:0;
      transition:0.6s ease;
    }

    .card:hover{
      transform:translateY(-10px) scale(1.02);
    }

    .card img{width:100%;height:220px;object-fit:cover}

    .card h3{padding:15px;font-size:20px}

    /* Gallery */
    .gallery img{
      width:100%;
      height:250px;
      object-fit:cover;
      border-radius:15px;
    }

    /* Contact */
    form{
      max-width:500px;
      margin:auto;
      display:flex;
      flex-direction:column;
      gap:15px;
    }

    input, textarea{
      padding:12px;
      border-radius:10px;
      border:1px solid #ccc;
    }

    button{
      padding:12px;
      border:none;
      background:#0ea5e9;
      color:#fff;
      border-radius:10px;
      cursor:pointer;
    }

    footer{
      text-align:center;
      padding:25px;
      background:#020617;
      color:#fff;
    }

    /* Animations */
    @keyframes fadeUp{
      from{opacity:0;transform:translateY(50px)}
      to{opacity:1;transform:translateY(0)}
    }

    /* Responsive */
    @media(max-width:768px){
      nav{padding:15px 20px}
      header h1{font-size:40px}
    }
  </style>
</head>

<body>

<!-- Navbar -->
<nav>
  <h2>Sri Lanka</h2>
  <div>
    <a href="#home">Home</a>
    <a href="#places">Places</a>
    <a href="#gallery">Gallery</a>
    <a href="#contact">Contact</a>
  </div>
</nav>

<!-- Hero -->
<header id="home">
  <div class="content">
    <h1>Discover Sri Lanka</h1>
    <p>Explore beaches, mountains & culture</p>
  </div>
</header>

<!-- Places -->
<section id="places">
  <h2>Top Destinations</h2>
  <div class="grid">

    <div class="card">
      <img src="https://images.unsplash.com/photo-1596402184320-417e7178b2cd">
      <h3>Sigiriya</h3>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1589391886645-d51941baf7fb">
      <h3>Ella</h3>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1605540436563-5bca919ae766">
      <h3>Nuwara Eliya</h3>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1589802829985-817e51171b92">
      <h3>Galle Fort</h3>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1564507592333-c60657eea523">
      <h3>Yala Safari</h3>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1617268170347-87d1f0e5c5e8">
      <h3>Mirissa Beach</h3>
    </div>

  </div>
</section>

<!-- Gallery -->
<section id="gallery">
  <h2>Sri Lanka Views</h2>
  <div class="grid gallery">
    <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e">
    <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470">
    <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee">
    <img src="https://images.unsplash.com/photo-1491553895911-0055eca6402d">
  </div>
</section>

<!-- Contact -->
<section id="contact">
  <h2>Contact</h2>
  <form>
    <input type="text" placeholder="Name" required>
    <input type="email" placeholder="Email" required>
    <textarea placeholder="Message" required></textarea>
    <button>Send Message</button>
  </form>
</section>

<footer>
  <p>© 2026 Sri Lanka Travel | Modern UI</p>
</footer>

<script>
  const cards = document.querySelectorAll('.card');

  window.addEventListener('scroll', () => {
    cards.forEach(card => {
      const top = card.getBoundingClientRect().top;
      if(top < window.innerHeight - 100){
        card.style.opacity = 1;
        card.style.transform = 'translateY(0)';
      }
    });
  });
</script>

</body>
</html>
